<html>
<head>
    <title>My Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;

        nav {
            background: #333;

        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        section {
            padding: 60px 20px;
            min-height: 300px;
        }

        #home { background: #f4f4f4; }
        #about { background: #ffffff; }
        #services { background: #f8f8f8; }
        #gallery { background: #ffffff; }
        #contact { background: #f4f4f4; }

</head>
<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#gallery">Gallery</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="home">
        <h1>Welcome to My Website</h1>
        <p>This is the home section.</p>
    </section>

    <section id="about">
        <h1>About Us</h1>
        <p>Information about your business or project.</p>
    </section>

    <section id="services">
        <h1>Services</h1>
        <p>Describe your services here.</p>
    </section>

    <section id="gallery">
        <h1>Gallery</h1>
        <img src="images/photo1.jpg" width="250" alt="Photo 1">
        <img src="images/photo2.jpg" width="250" alt="Photo 2">

    <section id="contact">
        <h1>Contact</h1>
        <p>Email: yourname@example.com</p>
